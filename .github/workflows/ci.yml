name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev portaudio19-dev libx11-dev libxtst-dev libpng-dev xclip

      - name: Install Go analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Download pinned native dependencies and models
        run: make deps

      - name: Build
        run: make build BUILD_TAGS=nohook

      - name: Test
        run: make test BUILD_TAGS=nohook

      - name: Vet
        run: make vet BUILD_TAGS=nohook

      - name: Staticcheck
        run: make staticcheck BUILD_TAGS=nohook

      - name: Vulnerability scan
        run: make govulncheck BUILD_TAGS=nohook
